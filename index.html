function formatVoiceTime(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));

  const r = s % 60;
  return `${m}:${r.toString().padStart(2, "0")}`;
}

        </div>
      </div>`;

}

function paymentStep(name, price, accent, backAction, confirmAction) {
  const methods = [...new Set(state.moneyAccounts.map(m => m.service))];
  if (!state.selectedPaymentMethod) {
    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" ${backAction}>‹</button><span class="title">Choose payment method</span></div>
    <div class="body">
      <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:14px;">${esc(name)} — $${price.toFixed(2)}</div>
      ${methods.length===0 ? `<div style="font-size:12.5px;color:var(--inkSoft);">No payment methods set up yet — contact admin.</div>` : methods.map(m => `
        <div class="row-item" style="cursor:pointer;" data-action="choosePaymentMethod" data-method="${esc(m)}">
          <div class="card-title">${esc(m)}</div>
        </div>`).join("")}
    </div>`;
  }
  const method = state.selectedPaymentMethod;
  const isBank = method === "Bank Transfer";
  const paynowMethod = PAYNOW_METHOD_MAP[method];
  const needsPhone = paynowMethod === "ecocash" || paynowMethod === "onemoney";

  // Real Paynow flow (EcoCash, OneMoney, InnBucks)
  if (paynowMethod) {
    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" data-action="backToMethods">‹</button><span class="title">Confirm payment</span></div>
    <div class="body" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:24px;">
      <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;">${esc(name)}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;margin:10px 0 6px;">$${price.toFixed(2)}</div>
      <div class="pill" style="margin-bottom:16px;">via ${esc(method)}</div>

      ${state.paynowStatus === "error" ? `<div style="color:#b3432b;font-size:12px;margin-bottom:14px;max-width:260px;">${esc(state.paynowError)}</div>` : ""}

      ${state.paynowStatus === "waiting" ? `
        <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:10px;max-width:260px;line-height:1.6;">
          ${state.paynowInstructions ? esc(state.paynowInstructions) : (paynowMethod === "innbucks" ? "Open your InnBucks app and enter the code below to complete payment." : `Check your phone — approve the ${esc(method)} prompt with your PIN.`)}
        </div>
        ${state.paynowAuthCode ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:2px;margin-bottom:6px;">${esc(state.paynowAuthCode)}</div>${state.paynowAuthExpires ? `<div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:16px;">Expires ${esc(state.paynowAuthExpires)}</div>` : ""}` : ""}
        <div style="font-size:12px;color:var(--inkSoft);margin:14px 0;">⏳ Waiting for payment confirmation…</div>
        <button class="btn-outline" data-action="cancelPaynowWait" style="width:100%;">Cancel</button>
      ` : `
        <div style="font-size:12px;color:var(--inkSoft);margin-bottom:20px;line-height:1.6;max-width:250px;">
          ${needsPhone ? `Enter your ${esc(method)} number — we'll send a payment prompt straight to it.` : `You'll get a code to enter in your InnBucks app to complete this payment.`}
        </div>
        ${needsPhone ? `<input id="paynowPhone" placeholder="e.g. 0771234567" value="${esc(state.paynowPhone||"")}" style="width:100%;border:1px solid var(--stoneDark);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px;box-sizing:border-box;text-align:center;">` : ""}
        <div style="width:100%;">
          <button class="btn" style="background:${accent};" data-action="startRealPayment" data-amount="${price}" data-desc="${esc(name)}" data-confirm="${confirmAction}" data-method="${paynowMethod}" ${state.paynowStatus === "initiating" ? "disabled" : ""}>
            ${state.paynowStatus === "initiating" ? "Starting…" : `Pay $${price.toFixed(2)} via ${esc(method)}`}
          </button>
        </div>
      `}
    </div>`;
  }

  // Bank transfer keeps the existing manual/off-app flow.
  return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" data-action="backToMethods">‹</button><span class="title">Confirm payment</span></div>
    <div class="body" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:24px;">
      <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;">${esc(name)}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;margin:10px 0 6px;">$${price.toFixed(2)}</div>
      <div class="pill" style="margin-bottom:16px;">via ${esc(method)}</div>
      <div style="font-size:12px;color:var(--inkSoft);margin-bottom:24px;line-height:1.6;max-width:250px;">
        ${isBank ? `You'll be given bank details to complete the transfer securely — never inside FWY.` : `We'll send a payment prompt to your ${esc(method)} number. Enter your PIN there — never inside FWY.`}
      </div>
      <div style="width:100%;"><button class="btn" style="background:${accent};" data-action="${confirmAction}">Simulate: payment confirmed</button></div>
    </div>`;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await loadSettings();
  if (session) await loadMyProfiles();
  await loadPublicLists();
  if (window.location.hash === "#admin") { state.showAdminTab = true; state.tab = "admin"; }
  if (!session) {
    try { state.showLanding = localStorage.getItem("fwy_landing_seen") !== "1"; } catch { state.showLanding = true; }
  }
  state.loaded = true;
  render();
}

async function loadSettings() {
  try {
    const { data } = await sb.from("settings").select("*").eq("id", 1).maybeSingle();
    if (data) state.settings = data;
  } catch { /* keep default */ }
}

async function loadPublicLists() {
  const { data: emps } = await sb.from("employers").select("*");
  const { data: seks } = await sb.from("seekers").select("*");
  const { data: money } = await sb.from("money_accounts").select("*");
  state.employers = emps || [];
  state.seekers = seks || [];
  state.moneyAccounts = money || [];
  await loadReviewStats();
}

async function loadMyProfiles() {
  if (!state.session) return;
  const uid = state.session.user.id;
  const { data: s } = await sb.from("seekers").select("*").eq("user_id", uid).maybeSingle();
  const { data: e } = await sb.from("employers").select("*").eq("user_id", uid).maybeSingle();
  subscribeToPush();
  if (s) {
    state.myProfile = s; state.seekerStep = "matches";
    maybeShowOnboarding("seeker");
    const { data: invs, error: invsErr } = await sb.from("fwy_invites").select("*").eq("seeker_id", s.id).neq("status", "rejected").order("created_at", { ascending: false });
    if (invsErr) console.error("fwy_invites fetch (seeker) failed:", invsErr.message);
    state.myInvites = (invs || []).filter(r => r.initiated_by !== "seeker");
    state.myApplications = (invs || []).filter(r => r.initiated_by === "seeker");
    const { data: verif } = await sb.from("verifications").select("*").eq("user_id", uid).maybeSingle();
    state.myVerification = verif || null;
  }
  if (e) {
    state.myProfile = e; state.employerStep = "candidates";
    maybeShowOnboarding("employer");
    const { data: invs, error: invsErr } = await sb.from("fwy_invites").select("*").eq("employer_id", e.id).neq("status", "rejected").order("created_at", { ascending: false });
    if (invsErr) console.error("fwy_invites fetch (employer) failed:", invsErr.message);
    state.myEmployerInvites = (invs || []).filter(r => r.initiated_by !== "seeker");
    state.myApplicants = (invs || []).filter(r => r.initiated_by === "seeker");
    const { data: posts } = await sb.from("job_postings").select("*").eq("employer_id", e.id).order("created_at", { ascending: false });
    state.myJobPostings = posts || [];
  }
  const { data: app } = await sb.from("team_applications").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (app) {
    state.myApplication = app;
    const { data: msgs } = await sb.from("chat_messages").select("*").eq("chat_key", `apply:${app.id}`).order("created_at", { ascending: true });
    state.teamChatMsgs = (msgs || []).filter(m => !m.hidden_for_user);
  }
  const { data: req } = await sb.from("service_requests").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (req) {
    state.myServiceRequest = req;
    const { data: msgs } = await sb.from("chat_messages").select("*").eq("chat_key", `service:${req.id}`).order("created_at", { ascending: true });
    state.serviceChatMsgs = (msgs || []).filter(m => !m.hidden_for_user);
  }
  await loadUnreadCounts();
  await loadReferralCount();
  await loadMyFollows();
}

function render() {
  const el = document.getElementById("screen");
  if (!state.loaded) { el.innerHTML = '<div class="loading">Loading…</div>'; return; }
  if (state.showLanding) { el.innerHTML = renderLandingPage(); attachHandlers(); return; }
  if (state.showTerms) { el.innerHTML = renderTermsViewer(); attachHandlers(); return; }
  if (state.eidoOpen) { el.innerHTML = renderEidoChat(); attachHandlers(); return; }
  let inner = "";
  if (state.tab === "seeker") inner = renderSeeker();
  else if (state.tab === "employer") inner = renderEmployer();
  else inner = renderAdmin();
  el.innerHTML = inner + renderBottomTabs() + renderOnboarding() + renderHelpButton() + renderHelpPanel();
  attachHandlers();
}

function maybeShowOnboarding(role) {

  } catch { /* localStorage unavailable — skip onboarding rather than break the app */ }
}
function onboardNext() { state.onboardStep++; render(); }
function onboardSkip() {
  try { if (state.onboardRole) localStorage.setItem(`fwy_onboarded_${state.onboardRole}`, "1"); } catch {}
  state.onboardOpen = false;
  render();
}

  if (st === "landing" || st === "profile") {

          <div style="cursor:pointer;flex:1;" data-action="openInviteAsEmployer" data-seeker-id="${esc(f.id)}" data-seeker-name="${esc(f.name)}"><div class="card-title">${esc(f.name)}</div><div class="card-sub">${esc(f.profession||"")}</div></div>

    </div>`;

    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" data-action="employerGo" data-step="candidates">‹</button><span class="title">Community</span></div>
    <div class="body">
      ${state.announcements.length === 0 ? `<div class="note">Nothing posted yet — check back soon.</div>` :
        state.announcements.map(a => `
        <div class="card" style="margin-bottom:10px;">

          ${a.attachment_type === "video" ? `<video src="${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${esc(a.attachment_path)}" controls style="max-width:100%;border-radius:8px;margin-top:8px;"></video>` : ""}

        </div>`).join("")}
    </div>`;
  }
  if (st === "templates") {
    if (state.docType) {
      const d = state.docType;
      const f = state.docForm;
      return `
      <div class="statusbar"><span>9:41</span><span>FWY</span></div>

    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>

    </div>`;
  }
  if (st === "jobPostings") {
    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>

    <div class="body">

        </div>`).join("")}

  if (st === "serviceRequest") {

    <div class="chatwrap" style="flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">

    </div>
    ${renderVoiceInputRow("service", "var(--ember)", `
    <div style="padding:12px;display:flex;gap:8px;border-top:1px solid var(--stoneDark);">
${state.chatAttachmentUploading ? `<div class="note" style="padding:0 12px;">Uploading… this can take a minute on slower connections.</div>` : ""}

  return "";
}

      <div style="font-size:11px;color:var(--inkSoft);margin-bottom:8px;">Applicant: ${esc(app.profession||"")} · Status: <b>${esc(app.status||"pending")}</b></div>

        <button data-action="acceptApplication" style="flex:1;font-size:11px;border:1px solid var(--moss);color:var(--moss);background:none;border-radius:8px;padding:6px 0;cursor:pointer;">Accept</button>

    <div class="chatwrap" style="flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
      ${state.adminChatMsgs.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);text-align:center;margin-top:20px;">No messages yet. Say hello.</div>` : ""}

  }

  }

    state.adminRequests.map(r => `

function attachHandlers() {
  document.getElementById("screen").querySelectorAll("[data-action]").forEach(elm => elm.addEventListener("click", onAction));
  const idFileEl = document.getElementById("idFile");
  const clearanceFileEl = document.getElementById("clearanceFile");
  const sfPhotoEl = document.getElementById("sf_photo");
  const efLogoEl = document.getElementById("ef_logo");
  if (idFileEl) idFileEl.addEventListener("change", ev => { document.getElementById("idFileName").textContent = ev.target.files[0]?.name || ""; });
  if (clearanceFileEl) clearanceFileEl.addEventListener("change", ev => { document.getElementById("clearanceFileName").textContent = ev.target.files[0]?.name || ""; });
  if (sfPhotoEl) sfPhotoEl.addEventListener("change", ev => { document.getElementById("sf_photoName").textContent = ev.target.files[0]?.name || ""; });
  if (efLogoEl) efLogoEl.addEventListener("change", ev => { document.getElementById("ef_logoName").textContent = ev.target.files[0]?.name || ""; });
  const eidoFileEl = document.getElementById("eidoFileInput");
  if (eidoFileEl) eidoFileEl.addEventListener("change", ev => handleEidoAttachment(ev.target.files[0]));
}

async function doAuth(mode, role) {
  const f = state.authForm;
  if (!f.email || !f.password) { state.authError = "Enter email and password."; render(); return; }
  state.authLoading = true; state.authError = ""; render();
  try {
    const fn = mode === "signUp" ? sb.auth.signUp.bind(sb.auth) : sb.auth.signInWithPassword.bind(sb.auth);
    const { data, error } = await fn({ email: f.email, password: f.password });
    state.authLoading = false;
    if (error) {
      if (/email not confirmed/i.test(error.message || "")) {

async function callClaude(systemPrompt, userText, imageData) {
  const body = { system: systemPrompt, message: userText };
  if (imageData) {
    const match = /^data:(.+);base64,(.+)$/.exec(imageData);
    if (match) body.image = { media_type: match[1], data: match[2] };
  }
  const response = await fetch(AI_FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok || data.error) throw new Error(data.error || "AI request failed");
  return (data.text || "").trim();
}

async function runAIMatch(role) {
  const mine = state.myProfile;
  const pool = role === "seeker" ? state.employers : state.seekers;
  if (!mine || pool.length === 0) { state.aiMatches = []; return; }
  state.aiMatchLoading = true; state.aiMatchError = ""; render();
  try {
    const poolText = pool.map(p => role === "seeker"
      ? `id:${p.id} | ${p.name} | needs: ${p.what_do} | category: ${p.category}`
      : `id:${p.id} | ${p.name} | profession: ${p.profession} | qualifications: ${p.qualifications || "none"} | category: ${p.category}`
    ).join("\n");
    const myText = role === "seeker"
      ? `Profession: ${mine.profession}. Qualifications: ${mine.qualifications || "none"}. Department: ${mine.department}.`
      : `Looking for: ${mine.what_do}. Department needed: ${mine.category}.`;
    const sys = "You are a matching assistant for a Zimbabwean job marketplace called FWY. Given one person's profile and a list of candidates, return ONLY a JSON array of objects like [{\"id\":\"<id>\",\"reason\":\"<one short sentence>\"}], best match first. No other text, no markdown fences.";
    const userText = `My profile:\n${myText}\n\nCandidates:\n${poolText}\n\nReturn the best matches as JSON.`;
    const raw = await callClaude(sys, userText);
    const cleaned = raw.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    state.aiMatches = parsed.map(m => ({
      ...pool.find(p => p.id === m.id),
      aiReason: m.reason,
    })).filter(p => p.id);
  } catch (err) {
    state.aiMatchError = "AI matching hit a snag — showing regular matches instead.";
    state.aiMatches = null;
  }
  state.aiMatchLoading = false;
  render();
}

}

// ---- WebRTC calling (peer-to-peer, signaled via Supabase Realtime — no third-party call server) ----
let rtcPeer = null, rtcChannel = null, rtcLocalStream = null, rtcMyId = null, rtcRoom = null, rtcAudioOnly = false, rtcPolite = false, rtcMakingOffer = false;
const RTC_ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
];
function startCall(audioOnly, room) {
  if (!room) return;
  rtcAudioOnly = audioOnly;
  rtcRoom = "fwy-call-" + room;
  rtcMyId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now());
  document.getElementById("callOverlay").classList.add("open");
  document.getElementById("callStatus").textContent = "Connecting…";
  document.getElementById("remoteAvatar").style.display = audioOnly ? "flex" : "none";
  document.getElementById("localVideo").style.display = audioOnly ? "none" : "block";
  const myInitial = ((state.myProfile && state.myProfile.name) || (state.adminSession ? "A" : "G")).trim().charAt(0).toUpperCase() || "?";
  document.getElementById("remoteAvatar").textContent = myInitial;
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: audioOnly ? false : { width: { ideal: 480 }, height: { ideal: 640 } } })
    .then((stream) => {
      rtcLocalStream = stream;
      if (!audioOnly) document.getElementById("localVideo").srcObject = stream;
      setupRtcPeer();
      joinRtcChannel();
    })
    .catch((err) => {
      alert("Couldn't access microphone/camera: " + err.message);
      endCall();
    });
}
function setupRtcPeer() {
  rtcPeer = new RTCPeerConnection({ iceServers: RTC_ICE_SERVERS });
  rtcLocalStream.getTracks().forEach(t => rtcPeer.addTrack(t, rtcLocalStream));
  rtcPeer.ontrack = (e) => {
    document.getElementById("callStatus").textContent = "Connected";
    if (!rtcAudioOnly) {
      const rv = document.getElementById("remoteVideo");
      if (rv.srcObject !== e.streams[0]) rv.srcObject = e.streams[0];
    } else {
      let a = document.getElementById("remoteAudioEl");
      if (!a) { a = document.createElement("audio"); a.id = "remoteAudioEl"; a.autoplay = true; document.body.appendChild(a); }
      if (a.srcObject !== e.streams[0]) a.srcObject = e.streams[0];
    }
  };
  rtcPeer.onicecandidate = (e) => {
    if (e.candidate && rtcChannel) rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "ice", data: e.candidate } });
  };
  rtcPeer.onconnectionstatechange = () => {
    if (rtcPeer && (rtcPeer.connectionState === "failed" || rtcPeer.connectionState === "disconnected")) {
      document.getElementById("callStatus").textContent = "Connection lost";
    }
  };
}
async function initiateOffer() {
  if (!rtcPeer || rtcMakingOffer || rtcPeer.signalingState !== "stable") return;
  try {
    rtcMakingOffer = true;
    const offer = await rtcPeer.createOffer();
    await rtcPeer.setLocalDescription(offer);
    rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "sdp", data: rtcPeer.localDescription } });
  } catch (err) { console.error(err); } finally { rtcMakingOffer = false; }
}
function joinRtcChannel() {
  rtcChannel = sb.channel(rtcRoom, { config: { broadcast: { self: false } } });
  rtcChannel.on("broadcast", { event: "signal" }, async ({ payload }) => {
    if (!payload || payload.from === rtcMyId || !rtcPeer) return;
    if (rtcPolite === false && payload.from) rtcPolite = rtcMyId > payload.from; // deterministic: higher id is polite
    if (payload.kind === "sdp") {
      const desc = payload.data;
      const offerCollision = desc.type === "offer" && (rtcMakingOffer || rtcPeer.signalingState !== "stable");
      const ignoreOffer = !rtcPolite && offerCollision;
      if (ignoreOffer) return;
      await rtcPeer.setRemoteDescription(desc);
      if (desc.type === "offer") {
        const answer = await rtcPeer.createAnswer();
        await rtcPeer.setLocalDescription(answer);
        rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "sdp", data: rtcPeer.localDescription } });
      }
    } else if (payload.kind === "ice") {
      try { await rtcPeer.addIceCandidate(payload.data); } catch (err) { /* ignore benign races */ }
    } else if (payload.kind === "bye") {
      endCall();
    }
  }).subscribe((status) => {
    if (status === "SUBSCRIBED") {
      // Both sides attempt to offer; polite/impolite comparison above resolves any glare.
      initiateOffer();
    }
  });
}
function toggleMuteCall() {
  if (!rtcLocalStream) return;
  const track = rtcLocalStream.getAudioTracks()[0];

function endCall() {
  if (rtcChannel) { try { rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "bye" } }); } catch (e) {} sb.removeChannel(rtcChannel); rtcChannel = null; }
  if (rtcPeer) { rtcPeer.close(); rtcPeer = null; }
  if (rtcLocalStream) { rtcLocalStream.getTracks().forEach(t => t.stop()); rtcLocalStream = null; }
  rtcPolite = false; rtcMakingOffer = false;
  const remoteAudioEl = document.getElementById("remoteAudioEl");
  if (remoteAudioEl) remoteAudioEl.remove();
  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("localVideo").srcObject = null;

function chatContextInfo(ctx) {

    if (!state.directChat) return null;
    return { chatKey: state.directChat.chatKey, senderId: state.session.user.id, senderRole: state.directChat.myRole };
  }
  if (ctx === "team") {
    if (!state.myApplication) return null;
    return { chatKey: `apply:${state.myApplication.id}`, senderId: state.session.user.id, senderRole: "applicant" };
  }
  if (ctx === "service") {
    if (!state.myServiceRequest) return null;
    return { chatKey: `service:${state.myServiceRequest.id}`, senderId: state.session.user.id, senderRole: "company" };
  }
  if (ctx === "admin") {
    if (!state.adminOpenChat) return null;
    return { chatKey: state.adminOpenChat.chatKey, senderId: state.adminSession.user.id, senderRole: "admin" };
  }
  return null;
}
async function refreshChatMsgs(ctx) {
  const info = chatContextInfo(ctx);
  if (!info) return;
  const { data } = await sb.from("chat_messages").select("*").eq("chat_key", info.chatKey).order("created_at", { ascending: true });
  let rows = data || [];
  if (ctx === "direct") {
    const hideCol = state.directChat.myRole === "seeker" ? "hidden_for_seeker" : "hidden_for_employer";
    state.directChat.msgs = rows.filter(m => !m[hideCol]);
  } else if (ctx === "team") state.teamChatMsgs = rows.filter(m => !m.hidden_for_user);
  else if (ctx === "service") state.serviceChatMsgs = rows.filter(m => !m.hidden_for_user);
  else if (ctx === "admin") state.adminChatMsgs = rows.filter(m => !m.hidden_for_admin);
  const inputId = ctx === "direct" ? "directChatInput" : ctx === "team" ? "teamChatInput" : ctx === "service" ? "serviceChatInput" : "adminChatInput";
  const active = document.activeElement;
  if (active && active.id === inputId) return; // don't steal focus / dismiss the keyboard while typing
  renderKeepScroll();
}
async function uploadChatAttachment(file, kind) {
  const safeName = (file.name || `${kind}-${Date.now()}`).replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${kind}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safeName}`;
  const { error } = await sb.storage.from("chat-attachments").upload(path, file, { upsert: false });
  if (error) { alert("Upload failed: " + error.message); return null; }
  return path;
}
async function sendChatAttachment(ctx, file, kind) {
  const info = chatContextInfo(ctx);
  if (!info || !file) return;
  state.chatAttachmentUploading = true; render();
  const path = await uploadChatAttachment(file, kind);
  state.chatAttachmentUploading = false;
  if (!path) { render(); return; }
  const label = kind === "audio" ? "🎤 Voice note" : kind === "image" ? "📷 Photo" : ("📄 " + (file.name || "Document"));
  const row = { chat_key: info.chatKey, sender_id: info.senderId, sender_role: info.senderRole, text: label, attachment_path: path, attachment_type: kind, attachment_name: file.name || null };
  const { error } = await sb.from("chat_messages").insert(row);
  if (error) { alert("Couldn't send: " + error.message); render(); return; }
  await refreshChatMsgs(ctx);
}
function pickChatFile(ctx, kind) {
  if (!chatContextInfo(ctx)) return;
  const input = document.createElement("input");
  input.type = "file";
  if (kind === "image") input.accept = "image/*";
  else input.accept = ".pdf,.doc,.docx,.xls,.xlsx,.txt,.ppt,.pptx,image/*";
  input.style.position = "fixed";
  input.style.top = "-1000px";
  document.body.appendChild(input);
  input.onchange = async () => {
    const file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    const realKind = (kind === "document" && file.type && file.type.startsWith("image/")) ? "image" : kind;
    await sendChatAttachment(ctx, file, realKind);
  };
  input.click();
}
let voiceRecorder = null, voiceChunks = [], voiceRecordingCtx = null, voiceRecordingTimer = null, voiceRecordingStream = null;
async function toggleVoiceNote(ctx) {
  if (!chatContextInfo(ctx)) return;
  if (voiceRecordingCtx || state.voiceReview) return; // already recording or reviewing one
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceRecordingStream = stream;
    voiceChunks = [];
    voiceRecorder = new MediaRecorder(stream);
    voiceRecordingCtx = ctx;
    state.voiceRecordingElapsed = 0;
    render();
    voiceRecordingTimer = setInterval(() => { state.voiceRecordingElapsed++; renderKeepScroll(); }, 1000);
    voiceRecorder.ondataavailable = (e) => { if (e.data.size > 0) voiceChunks.push(e.data); };
    voiceRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(voiceRecordingTimer);
      voiceRecordingTimer = null;
      const finishedCtx = voiceRecordingCtx;
      const duration = state.voiceRecordingElapsed;
      voiceRecordingCtx = null;
      const blob = new Blob(voiceChunks, { type: "audio/webm" });
      if (blob.size > 500) {
        state.voiceReview = { ctx: finishedCtx, blob, url: URL.createObjectURL(blob), duration, playing: false };
      }
      render();
    };
    voiceRecorder.start();
  } catch (err) {
    voiceRecordingCtx = null;
    alert("Couldn't access microphone: " + err.message);
  }
}
function stopVoiceRecording() {
  if (voiceRecorder && voiceRecordingCtx) voiceRecorder.stop();
}

const reviewAudio = new Audio();
function toggleVoiceReviewPlayback() {

function toggleSentVoicePlayback(msgId, url) {

async function startRealPayment(amountStr, description, confirmAction, method) {
  const amount = parseFloat(amountStr);
  let phone = "";
  if (method === "ecocash" || method === "onemoney") {
    const phoneInput = document.getElementById("paynowPhone");
    phone = (phoneInput?.value || "").trim();
    if (!phone) { alert("Please enter your phone number first."); return; }
    state.paynowPhone = phone;
  }
  state.paynowStatus = "initiating";
  state.paynowError = "";
  render();
  try {
    const email = state.session?.user?.email || state.myProfile?.contact || state.myProfile?.email || "noreply@fwyou.com";
    const reference = "FWY-" + Date.now();
    const res = await fetch(PAYNOW_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ action: "initiate", amount, reference, description, email, phone: phone || undefined, method }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      state.paynowStatus = "error";
      state.paynowError = data.error || "Couldn't start the payment — please try again.";
      render();
      return;
    }
    state.paynowInstructions = data.instructions;
    state.paynowAuthCode = data.authorizationCode;
    state.paynowAuthExpires = data.authorizationExpires;
    state.paynowPollUrl = data.pollUrl;
    state.paynowStatus = "waiting";
    render();
    if (data.pollUrl) startPaynowPolling(data.pollUrl, confirmAction);
  } catch {
    state.paynowStatus = "error";
    state.paynowError = "Couldn't reach the payment service — check your connection and try again.";
    render();
  }
}
function startPaynowPolling(pollUrl, confirmAction) {
  stopPaynowPolling();
  paynowPollAttempts = 0;
  paynowPollTimer = setInterval(async () => {
    paynowPollAttempts++;
    if (paynowPollAttempts > 30) { // ~2 minutes at 4s intervals
      stopPaynowPolling();
      state.paynowStatus = "error";
      state.paynowError = "This is taking longer than expected. If you already approved it, check back shortly — otherwise try again.";
      render();
      return;
    }
    try {
      const res = await fetch(PAYNOW_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY },
        body: JSON.stringify({ action: "poll", pollUrl }),
      });
      const data = await res.json();
      if (data.paid) {
        stopPaynowPolling();
        resetPaynowState();
        state.selectedPaymentMethod = null;
        render();
        if (typeof window[confirmAction] === "function") await window[confirmAction]();
      } else if (["cancelled", "failed", "disputed"].includes(data.status)) {
        stopPaynowPolling();
        state.paynowStatus = "error";
        state.paynowError = "The payment wasn't completed — you can try again.";
        render();
      }
      // otherwise still pending ("created"/"sent") — keep polling
    } catch { /* keep polling despite a transient network error */ }
  }, 4000);
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function subscribeToPush() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    const uid = (state.session && state.session.user.id) || (state.adminSession && state.adminSession.user.id);
    if (!uid) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      if (Notification.permission === "denied") return;
      const perm = await Notification.requestPermission();
      if (perm !== "granted") return;
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await sb.from("push_subscriptions").upsert(
      { user_id: uid, subscription: sub.toJSON() },
      { onConflict: "user_id" }
    );
  } catch { /* push is best-effort, never block the app */ }
}

  sendEmailNotification(req.email, "FWY payment received", `We've received your service request fee: $${(state.settings.service_request_fee||0).toFixed(2)}.`);

function eidoPublicSystemPrompt() {
  const role = state.tab === "employer" ? "employer" : "seeker";
  const helpText = (HELP_CONTENT[role] || []).map(s => `${s.h}: ${s.b}`).join("\n");
  return "You are Eido, the friendly help assistant for FWYOU (FWY), a job marketplace app in Zimbabwe connecting job seekers and employers. " +
    "Always reply in the same language the person writes in — Shona, Ndebele, Swahili, Portuguese, French, English, or any other African language — matching their language naturally, without commenting on the fact that you're doing so. " +
    "Here is everything you are allowed to know about how the app works, and the ONLY thing you should base your answers on:\n\n" + helpText + "\n\n" +
    "Rules you must always follow: " +
    "1) You only help with how to use FWY — navigation, features, fees the person can already see in the app, verification, chat, and calls. " +
    "2) You must NEVER discuss or speculate about FWY's internal business logic, revenue, profit, admin tools, database or technical setup, other users' private information, or anything about how FWY is run behind the scenes. If asked, politely say that's not something you're able to share, and offer to help with something you can. " +
    "3) If the person describes a real problem — a bug, a bad experience, a scam, harassment, or a safety concern — be supportive, and let them know they can tap \"Report this to the FWY team\" below the chat so admin can look into it directly. " +
    "4) Keep answers short and conversational, like a helpful person texting back, not a formal document.";
}
function eidoContext() {
  if (state.tab === "admin" && state.adminSession) return "admin";
  return state.tab === "employer" ? "employer" : "seeker";
}
async function loadEidoThread(context) {
  const uid = context === "admin" ? state.adminSession?.user?.id : state.session?.user?.id;
  if (!uid) { state.eidoThreads[context] = []; return; }
  try {
    const { data } = await sb.from("ai_messages").select("*").eq("user_id", uid).eq("context", context).order("created_at", { ascending: true });
    state.eidoThreads[context] = (data || []).map(m => ({ id: m.id, role: m.role, text: m.text }));
  } catch { state.eidoThreads[context] = []; }
}
function makeMsgId() { return Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
async function handleEidoAttachment(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { alert("That file is a bit large — please pick one under 8MB."); return; }
  if (file.type.startsWith("image/")) {
    const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
    state.eidoPendingAttachment = { imageData: dataUrl, fileName: file.name, fileType: file.type };
  } else {
    state.eidoPendingAttachment = { fileName: file.name, fileType: file.type };
  }
  render();
}
let eidoRecognizer = null;
function toggleEidoMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Voice input isn't supported on this browser — please type instead."); return; }
  if (state.eidoListening) {
    eidoRecognizer?.stop();
    return;
  }
  eidoRecognizer = new SR();
  eidoRecognizer.lang = state.eidoRecogLang;
  eidoRecognizer.interimResults = false;
  eidoRecognizer.maxAlternatives = 1;
  eidoRecognizer.onstart = () => { state.eidoListening = true; render(); };
  eidoRecognizer.onresult = (ev) => {
    const transcript = ev.results[0][0].transcript;
    const input = document.getElementById("eidoInput");
    if (input) input.value = (input.value ? input.value + " " : "") + transcript;
  };
  eidoRecognizer.onerror = () => {
    state.eidoListening = false;
    render();
    alert("Couldn't catch that — try again, or switch the language in the dropdown, or just type instead.");
  };
  eidoRecognizer.onend = () => { state.eidoListening = false; render(); };
  try { eidoRecognizer.start(); } catch { state.eidoListening = false; render(); }
}
async function eidoSendMessage(text, attachment) {
  const ctx = eidoContext();
  const uid = ctx === "admin" ? state.adminSession?.user?.id : state.session?.user?.id;
  if (!uid) return;
  const userMsg = { id: makeMsgId(), role: "user", text };
  if (attachment?.imageData) userMsg.imageData = attachment.imageData;
  else if (attachment?.fileName) userMsg.fileName = attachment.fileName;
  state.eidoThreads[ctx] = [...(state.eidoThreads[ctx] || []), userMsg];
  state.eidoLoading = true;
  render();
  sb.from("ai_messages").insert({ user_id: uid, role: "user", text: text || "", context: ctx }).select().single()
    .then(({ data }) => { if (data) userMsg.id = data.id; });
  try {
    const sys = ctx === "admin"
      ? `You are Eido, FWY's assistant for admin staff. Help them troubleshoot problems and answer questions about running FWY. [Context: current books: ${booksSummary()}]`
      : eidoPublicSystemPrompt();
    let messageForAI = text || "";
    if (attachment?.fileName && !attachment.imageData) {
      messageForAI += `\n\n[The user attached a document named "${attachment.fileName}" (${attachment.fileType || "unknown type"}). You cannot open this file directly — kindly ask them to describe what's in it or type the key details if you need to help with it.]`;
    }
    const reply = await callClaude(sys, messageForAI, attachment?.imageData) || "Sorry, I couldn't get a response just now — please try again.";
    const assistantMsg = { id: makeMsgId(), role: "assistant", text: reply };
    state.eidoThreads[ctx] = [...state.eidoThreads[ctx], assistantMsg];
    sb.from("ai_messages").insert({ user_id: uid, role: "assistant", text: reply, context: ctx }).select().single()
      .then(({ data }) => { if (data) assistantMsg.id = data.id; });
  } catch {
    state.eidoThreads[ctx] = [...state.eidoThreads[ctx], { id: makeMsgId(), role: "assistant", text: "Sorry, I'm having trouble responding right now. Please try again in a moment." }];
  }
  state.eidoLoading = false;
  render();
}
async function sendEido() {
  const input = document.getElementById("eidoInput");
  const text = input && input.value.trim();
  const attachment = state.eidoPendingAttachment;
  if ((!text && !attachment) || state.eidoLoading) return;
  input.value = "";
  state.eidoPendingAttachment = null;
  await eidoSendMessage(text, attachment);
}
async function askAIAboutBooks() {
  state.adminTab = "ai";
  await loadEidoThread("admin");
  render();
  await eidoSendMessage("Look at our current books and give me a quick read on how we're doing — profit or loss, and anything that stands out.", null);

function speakEidoMsg(id) {
  if (!("speechSynthesis" in window)) { alert("Read-aloud isn't supported on this browser."); return; }
  const synth = window.speechSynthesis;
  if (state.eidoSpeakingId === id) {
    if (synth.speaking && !synth.paused) { synth.pause(); }
    else if (synth.paused) { synth.resume(); }
    else { state.eidoSpeakingId = null; }
    render();
    return;
  }
  synth.cancel();
  const msg = (state.eidoThreads[eidoContext()] || []).find(m => m.id === id);
  if (!msg || !msg.text) return;
  const utterance = new SpeechSynthesisUtterance(msg.text);
  utterance.onend = () => { state.eidoSpeakingId = null; render(); };
  utterance.onerror = () => { state.eidoSpeakingId = null; render(); };
  state.eidoSpeakingId = id;
  synth.speak(utterance);
  render();
}
async function reportToEido() {
  const ctx = eidoContext();
  const transcript = (state.eidoThreads[ctx] || []).map(m => `${m.role === "user" ? "User" : "Eido"}: ${m.text}`).join("\n");
  const name = state.myProfile?.name || "Unknown user";
  const contact = state.myProfile?.contact || state.myProfile?.email || "";
  try {
    await sb.from("user_reports").insert({ reporter_name: name, reporter_contact: contact, transcript });

  sendEmailNotification(state.settings.owner_notify_email, "FWY: report via Eido", `${name} (${contact || "no contact given"}) reported something via Eido:\n\n${transcript}`);

  render();
}

function booksSummary() {
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - 7);
  const range = state.booksRange;
  const inRange = (d) => {
    const dt = new Date(d);
    if (range === "week") return dt >= startOfWeek;
    if (range === "month") return dt >= startOfMonth;
    if (range === "lastmonth") return dt >= startOfLastMonth && dt < startOfMonth;
    return true;
  };
  const txns = state.adminTransactions.filter(x => inRange(x.created_at));
  const totalIn = txns.filter(x => x.direction === "in").reduce((a, x) => a + Number(x.amount), 0);
  const totalOut = txns.filter(x => x.direction === "out").reduce((a, x) => a + Number(x.amount), 0);
  const byType = {};
  txns.forEach(x => { byType[x.type] = (byType[x.type] || 0) + (x.direction === "in" ? Number(x.amount) : -Number(x.amount)); });
  const lines = Object.entries(byType).map(([k, v]) => `${k}: $${v.toFixed(2)}`).join(", ");
  const rangeLabel = { week: "the last 7 days", month: "this month", lastmonth: "last month", all: "all time" }[range] || "all time";
  return `Range: ${rangeLabel}. Total revenue: $${totalIn.toFixed(2)}. Total payroll/expenses: $${totalOut.toFixed(2)}. Net: $${(totalIn - totalOut).toFixed(2)}. Breakdown — ${lines || "no transactions yet"}.`;
}

init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  // Capture Chrome's install prompt so we can trigger it from our own button
  // instead of relying on people finding it in the browser menu.
  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (typeof state !== 'undefined') {
      state.installPromptAvailable = true;
      if (typeof render === 'function') render();
    }
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if (typeof state !== 'undefined') {
      state.installPromptAvailable = false;
      state.installed = true;
      if (typeof render === 'function') render();
    }
  });

  async function triggerInstallPrompt() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    state.installPromptAvailable = false;
    if (outcome === 'accepted') state.installed = true;
    render();
  }
</script>
