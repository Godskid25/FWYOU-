<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F.W.Y. — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#24211D; --inkSoft:#6B655A; --stone:#EDE7DA; --stoneDark:#D8CFBC;
    --moss:#5F7A68; --ember:#BF6B1F; --cream:#F7F3EA; --red:#B14A3E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--stone);font-family:'Inter',sans-serif;color:var(--ink);}
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px;gap:18px;}
  .phone{width:360px;height:720px;border-radius:40px;background:var(--ink);padding:10px;box-shadow:0 30px 60px -20px rgba(36,33,29,.45);}
  .screen{width:100%;height:100%;border-radius:30px;background:var(--cream);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .statusbar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
  .header{padding:4px 20px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--stoneDark);}
  .header .back{cursor:pointer;background:none;border:none;font-size:18px;padding:0;}
  .header .title{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:19px;}
  .body{flex:1;padding:18px;overflow-y:auto;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:10.5px;color:var(--inkSoft);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .field input{width:100%;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:13px;background:#fff;box-sizing:border-box;}
  .field textarea{width:100%;min-height:80px;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:13px;background:#fff;box-sizing:border-box;resize:vertical;}
  .field select{width:100%;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:13px;background:#fff;box-sizing:border-box;}
  .btn{width:100%;padding:12px 16px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;color:#fff;}
  .btn-moss{background:var(--moss);} .btn-ember{background:var(--ember);} .btn-ink{background:var(--ink);}
  .btn-outline{background:none;border:1px solid var(--inkSoft);color:var(--inkSoft);text-decoration:underline;font-size:12px;padding:4px;}
  .card{border:1px solid var(--stoneDark);border-radius:12px;padding:13px;margin-bottom:9px;background:#fff;}
  .card-title{font-size:13px;font-weight:600;} .card-sub{font-size:11.5px;color:var(--inkSoft);}
  .err{font-size:11px;color:var(--red);margin:-4px 0 10px;}
  .note{font-size:10px;color:var(--inkSoft);margin-bottom:14px;line-height:1.5;}
  .row-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--stoneDark);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff;}
  .trash{border:none;background:none;color:var(--red);cursor:pointer;font-size:15px;}
  .bottomtabs{display:flex;border-top:1px solid var(--stoneDark);background:var(--cream);}
  .bottomtabs button{flex:1;background:none;border:none;cursor:pointer;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--inkSoft);font-size:9px;font-family:'IBM Plex Mono',monospace;}
  .bottomtabs button.active{color:var(--ink);}
  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--inkSoft);}
  .pill{display:inline-block;font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:4px 9px;border-radius:999px;border:1px solid var(--moss);color:var(--moss);background:rgba(95,122,104,.08);}

  .file-wrap{border:2px dashed var(--stoneDark);border-radius:10px;padding:12px;text-align:center;margin-bottom:11px;}
  .file-wrap input{font-size:11.5px;}
  .file-wrap .fname{font-size:11px;color:var(--moss);margin-top:6px;}
  .status-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;}
  .status-pending{background:rgba(191,107,31,.1);color:var(--ember);border:1px solid var(--ember);}
  .status-submitted{background:rgba(107,101,90,.12);color:var(--inkSoft);border:1px solid var(--stoneDark);}
  .status-approved{background:rgba(95,122,104,.1);color:var(--moss);border:1px solid var(--moss);}
  .status-rejected{background:rgba(177,74,62,.1);color:var(--red);border:1px solid var(--red);}
  .doc-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .doc-link{padding:5px 10px;border:1px solid var(--ink);color:var(--ink);border-radius:8px;font-size:10.5px;text-decoration:none;}
  .call-row{display:flex;gap:8px;padding:10px 14px 0;}
  .call-row button{flex:1;font-size:11px;padding:7px 0;border-radius:8px;border:1px solid var(--stoneDark);background:none;color:var(--inkSoft);cursor:pointer;}
  #callOverlay{display:none;position:fixed;inset:0;background:#111;z-index:500;}
  #callOverlay.open{display:flex;flex-direction:column;}
  #remoteVideoWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
  #remoteVideo{width:100%;height:100%;object-fit:cover;}
  #remoteAvatar{width:96px;height:96px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;}
  #localVideo{position:absolute;bottom:16px;right:16px;width:90px;height:130px;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#000;}
  #callStatus{position:absolute;top:14px;left:14px;color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:8px;}
  #callControls{display:flex;gap:14px;justify-content:center;padding:16px;background:#000;}
  #callControls button{width:48px;height:48px;border-radius:50%;border:none;font-size:18px;cursor:pointer;}
  .callBtnDim{background:#333;color:#fff;}
  .callBtnDim.off{background:#eee;color:#111;}
  #closeCallBtn{background:var(--red);color:#fff;}
</style>
</head>
<body>
<div class="page">
  <div>
    <div style="text-align:center;margin:4px 0 2px;">
      <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:34px;color:var(--ink);">FW<span style="color:var(--ember);">You</span></span>
      <div style="width:150px;margin:2px auto 0;border-bottom:2px solid var(--ink);"></div>
      <div style="width:150px;margin:3px auto 0;border-bottom:2px solid var(--ink);"></div>
    </div>
    <div style="text-align:center;font-size:9px;color:#999;margin-top:4px;">build-v2-moneybooksteam</div>

</div>
<div id="callOverlay">

    <button id="closeCallBtn" onclick="endCall()">✕</button>

</div>

<script>
const SUPABASE_URL = "https://qoqvbawpdvkrggapsmus.supabase.co";
function chatBubbleContent(m) {
  if (m.attachment_type === "image" && m.attachment_path) {
    return `<img src="${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${esc(m.attachment_path)}" style="max-width:100%;border-radius:8px;display:block;margin-bottom:2px;">`;
  }
  if (m.attachment_type === "audio" && m.attachment_path) {
    return `<audio controls style="max-width:190px;height:32px;" src="${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${esc(m.attachment_path)}"></audio>`;
  }
  if (m.attachment_type === "document" && m.attachment_path) {
    return `<a href="${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${esc(m.attachment_path)}" target="_blank" style="color:inherit;text-decoration:underline;">📄 ${esc(m.attachment_name || "Document")}</a>`;
  }
  return esc(m.text);
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const EMAIL_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/send-email-`;

  loaded: false,
};

function esc(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function mineVerifyBadge(mine) {
  const v = state.myVerification;
  if (mine?.verified) return `<span class="status-badge status-approved">Verified ✓</span>`;
  if (v?.status === "rejected") return `<span class="status-badge status-rejected">Rejected — please resubmit</span>`;
  if (v?.status === "pending") return `<span class="status-badge status-submitted">Documents submitted — awaiting review</span>`;
  return `<span class="status-badge status-pending">Not submitted</span>`;
}

function directChatScreen(backAttr) {
  const dc = state.directChat;
  if (!dc) return "";
  return `
  <div class="statusbar"><span>9:41</span><span>FWY</span></div>
  <div class="header"><button class="back" ${backAttr}>‹</button><span class="title">${esc(dc.otherName)}</span><button data-action="deleteChatForMe" data-chatkey="${esc(dc.chatKey)}" data-role="${esc(dc.myRole)}" style="background:none;border:1px solid var(--stoneDark);border-radius:8px;font-size:11px;padding:4px 8px;cursor:pointer;">Delete chat</button></div>
  <div class="call-row">
    <button data-action="startCall" data-audio="true" data-room="${esc(dc.chatKey.replace(/[^a-zA-Z0-9-]/g,'-'))}">Voice call</button>
    <button data-action="startCall" data-audio="false" data-room="${esc(dc.chatKey.replace(/[^a-zA-Z0-9-]/g,'-'))}">Video call</button>
  </div>
  <div class="chatwrap" style="flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
    ${dc.msgs.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);text-align:center;margin-top:20px;">No messages yet. Say hello.</div>` : ""}
    ${dc.msgs.map(m => `<div style="align-self:${m.sender_role===dc.myRole?'flex-end':'flex-start'};display:flex;align-items:center;gap:6px;max-width:78%;">${m.sender_role===dc.myRole ? `<button data-action="deleteMessage" data-id="${esc(m.id||'')}" title="Delete" style="background:none;border:none;color:var(--inkSoft);font-size:11px;cursor:pointer;padding:0;">✕</button>` : ""}<div style="background:${m.sender_role===dc.myRole?'var(--ink)':'#fff'};color:${m.sender_role===dc.myRole?'#fff':'var(--ink)'};border:${m.sender_role===dc.myRole?'none':'1px solid var(--stoneDark)'};border-radius:12px;padding:8px 12px;font-size:12.5px;">${chatBubbleContent(m)}</div></div>`).join("")}
  </div>
  <div style="padding:12px;display:flex;gap:8px;border-top:1px solid var(--stoneDark);">
    <button data-action="pickChatImage" data-ctx="direct" title="Photo/camera" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">📷</button>
    <button data-action="pickChatDocument" data-ctx="direct" title="Document" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">📎</button>
    <button id="voiceBtn_direct" data-action="toggleVoiceNote" data-ctx="direct" title="Voice note" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">🎤</button>
    <input id="directChatInput" placeholder="Message..." style="flex:1;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:0;">
    <button data-action="sendDirectChat" style="background:var(--ink);border:none;border-radius:10px;width:38px;flex-shrink:0;color:#fff;cursor:pointer;">➤</button>

}

function paymentStep(name, price, accent, backAction, confirmAction) {
  const methods = [...new Set(state.moneyAccounts.map(m => m.service))];
  if (!state.selectedPaymentMethod) {
    return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" ${backAction}>‹</button><span class="title">Choose payment method</span></div>
    <div class="body">
      <div style="font-size:12.5px;color:var(--inkSoft);margin-bottom:14px;">${esc(name)} — $${price.toFixed(2)}</div>
      ${methods.length===0 ? `<div style="font-size:12.5px;color:var(--inkSoft);">No payment methods set up yet — contact admin.</div>` : methods.map(m => `
        <div class="row-item" style="cursor:pointer;" data-action="choosePaymentMethod" data-method="${esc(m)}">
          <div class="card-title">${esc(m)}</div>
        </div>`).join("")}
    </div>`;
  }
  const isBank = state.selectedPaymentMethod === "Bank Transfer";
  return `
    <div class="statusbar"><span>9:41</span><span>FWY</span></div>
    <div class="header"><button class="back" data-action="backToMethods">‹</button><span class="title">Confirm payment</span></div>
    <div class="body" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:24px;">
      <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;">${esc(name)}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;margin:10px 0 6px;">$${price.toFixed(2)}</div>
      <div class="pill" style="margin-bottom:16px;">via ${esc(state.selectedPaymentMethod)}</div>
      <div style="font-size:12px;color:var(--inkSoft);margin-bottom:24px;line-height:1.6;max-width:250px;">
        ${isBank ? `You'll be given bank details to complete the transfer securely — never inside FWY.` : `We'll send a payment prompt to your ${esc(state.selectedPaymentMethod)} number. Enter your PIN there — never inside FWY.`}
      </div>
      <div style="width:100%;"><button class="btn" style="background:${accent};" data-action="${confirmAction}">Simulate: payment confirmed</button></div>
    </div>`;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await loadSettings();
  if (session) await loadMyProfiles();
  await loadPublicLists();
  state.loaded = true;
  render();
  if (state.settings.ai_matching_enabled) {
    if (state.seekerStep === "matches") await runAIMatch("seeker");
    else if (state.employerStep === "candidates") await runAIMatch("employer");
  }
}

async function loadSettings() {
  try {
    const { data } = await sb.from("settings").select("*").eq("id", 1).maybeSingle();
    if (data) state.settings = data;
  } catch { /* keep default */ }
}

async function loadPublicLists() {
  const { data: emps } = await sb.from("employers").select("*");
  const { data: seks } = await sb.from("seekers").select("*");
  const { data: money } = await sb.from("money_accounts").select("*");
  state.employers = emps || [];
  state.seekers = seks || [];
  state.moneyAccounts = money || [];
}

async function loadMyProfiles() {
  if (!state.session) return;
  const uid = state.session.user.id;
  const { data: s } = await sb.from("seekers").select("*").eq("user_id", uid).maybeSingle();
  const { data: e } = await sb.from("employers").select("*").eq("user_id", uid).maybeSingle();
  if (s) {
    state.myProfile = s; state.seekerStep = "matches";
    maybeShowOnboarding("seeker");
    const { data: invs, error: invsErr } = await sb.from("fwy_invites").select("*").eq("seeker_id", s.id).neq("status", "rejected").order("created_at", { ascending: false });
    if (invsErr) console.error("fwy_invites fetch (seeker) failed:", invsErr.message);
    state.myInvites = (invs || []).filter(r => r.initiated_by !== "seeker");
    state.myApplications = (invs || []).filter(r => r.initiated_by === "seeker");
    const { data: verif } = await sb.from("verifications").select("*").eq("user_id", uid).maybeSingle();
    state.myVerification = verif || null;
  }
  if (e) {
    state.myProfile = e; state.employerStep = "candidates";
    maybeShowOnboarding("employer");
    const { data: invs, error: invsErr } = await sb.from("fwy_invites").select("*").eq("employer_id", e.id).neq("status", "rejected").order("created_at", { ascending: false });
    if (invsErr) console.error("fwy_invites fetch (employer) failed:", invsErr.message);
    state.myEmployerInvites = (invs || []).filter(r => r.initiated_by !== "seeker");
    state.myApplicants = (invs || []).filter(r => r.initiated_by === "seeker");
  }
  const { data: app } = await sb.from("team_applications").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (app) {
    state.myApplication = app;
    const { data: msgs } = await sb.from("chat_messages").select("*").eq("chat_key", `apply:${app.id}`).order("created_at", { ascending: true });
    state.teamChatMsgs = (msgs || []).filter(m => !m.hidden_for_user);
  }
  const { data: req } = await sb.from("service_requests").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (req) {
    state.myServiceRequest = req;
    const { data: msgs } = await sb.from("chat_messages").select("*").eq("chat_key", `service:${req.id}`).order("created_at", { ascending: true });
    state.serviceChatMsgs = (msgs || []).filter(m => !m.hidden_for_user);
  }
  await loadUnreadCounts();
}

function render() {
  const el = document.getElementById("screen");
  if (!state.loaded) { el.innerHTML = '<div class="loading">Loading…</div>'; return; }
  let inner = "";
  if (state.tab === "seeker") inner = renderSeeker();
  else if (state.tab === "employer") inner = renderEmployer();
  else inner = renderAdmin();
  el.innerHTML = inner + renderBottomTabs() + renderOnboarding() + renderHelpButton() + renderHelpPanel();
  attachHandlers();
}

function maybeShowOnboarding(role) {

}
function onboardNext() { state.onboardStep++; render(); }
function onboardSkip() {
  try { if (state.onboardRole) localStorage.setItem(`fwy_onboarded_${state.onboardRole}`, "1"); } catch {}

  render();

        <button data-action="acceptApplication" style="flex:1;font-size:11px;border:1px solid var(--moss);color:var(--moss);background:none;border-radius:8px;padding:6px 0;cursor:pointer;">Accept</button>

    <div class="call-row">
      <button data-action="startCall" data-audio="true" data-room="${esc(oc.chatKey.replace(/[^a-zA-Z0-9-]/g,'-'))}">Voice call</button>

    <div class="chatwrap" style="flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
      ${state.adminChatMsgs.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);text-align:center;margin-top:20px;">No messages yet. Say hello.</div>` : ""}
      ${state.adminChatMsgs.map(m => {

        return `<div style="align-self:${mine?'flex-end':'flex-start'};display:flex;align-items:center;gap:6px;max-width:78%;">${mine ? `<button data-action="deleteMessage" data-id="${esc(m.id||'')}" data-ctx="admin" title="Delete" style="background:none;border:none;color:var(--inkSoft);font-size:11px;cursor:pointer;padding:0;">✕</button>` : ""}<div style="background:${mine?'var(--ink)':'#fff'};color:${mine?'#fff':'var(--ink)'};border:${mine?'none':'1px solid var(--stoneDark)'};border-radius:12px;padding:8px 12px;font-size:12.5px;">${chatBubbleContent(m)}</div></div>`;
      }).join("")}
    </div>
    <div style="padding:12px;display:flex;gap:8px;border-top:1px solid var(--stoneDark);">
      <button data-action="pickChatImage" data-ctx="admin" title="Photo/camera" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">📷</button>
      <button data-action="pickChatDocument" data-ctx="admin" title="Document" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">📎</button>
      <button id="voiceBtn_admin" data-action="toggleVoiceNote" data-ctx="admin" title="Voice note" style="border:1px solid var(--stoneDark);background:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;cursor:pointer;font-size:15px;">🎤</button>
      <input id="adminChatInput" placeholder="Reply..." style="flex:1;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:0;">
      <button data-action="sendAdminChat" style="background:var(--ink);border:none;border-radius:10px;width:38px;flex-shrink:0;color:#fff;cursor:pointer;">➤</button>
    </div>`;
  }

  const tabs = state.adminRole === "owner"
    ? ["seekers", "employers", "applicants", "requests", "chat", "ai", "activity", "money", "books", "settings", "team"]
    : ["seekers", "employers", "applicants", "requests", "chat", "ai", "activity"];
  let content = "";
  const t = state.adminTab;
  if (t === "seekers") content = state.adminSeekers.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">None yet.</div>` :
    state.adminSeekers.map(s => {
      const v = s._verification;
      let verifBlock = "";
      if (s.verification_pending && !s.verified) {
        if (v && v.status === "pending" && v._idUrl && v._clearanceUrl) {
          verifBlock = `<div style="margin-top:6px;">
            <div class="doc-row">
              <a class="doc-link" href="${esc(v._idUrl)}" target="_blank">View ID</a>
              <a class="doc-link" href="${esc(v._clearanceUrl)}" target="_blank">View Police Clearance</a>
            </div>
            <button data-action="approveVerification" data-id="${s.id}" data-name="${esc(s.name)}" style="font-size:11px;border:1px solid var(--moss);color:var(--moss);background:none;border-radius:8px;padding:3px 8px;cursor:pointer;margin-right:6px;">Approve</button>
            <button data-action="rejectVerification" data-id="${s.id}" data-uid="${esc(v.user_id)}" data-name="${esc(s.name)}" style="font-size:11px;border:1px solid var(--red);color:var(--red);background:none;border-radius:8px;padding:3px 8px;cursor:pointer;">Reject</button>
          </div>`;
        } else {
          verifBlock = `<div style="margin-top:6px;"><span class="pill" style="border-color:var(--ember);color:var(--ember);background:rgba(191,107,31,.08);">Paid — awaiting document upload</span></div>`;
        }
      }
      return `
      <div class="row-item"><div style="flex:1;"><div class="card-title">${esc(s.name)}${s.age?` · ${esc(s.age)}y`:""}${s.verified?" · ✓ Verified":""}${s.boosted?" · ★":""}</div><div class="card-sub">${esc(s.profession)} · ${esc(s.category)}</div>
      ${verifBlock}</div>
      <button class="trash" data-action="adminRemoveSeeker" data-id="${s.id}">🗑</button></div>`;
    }).join("");
  else if (t === "employers") content = state.adminEmployers.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">None yet.</div>` :
    state.adminEmployers.map(e => `
      <div class="row-item"><div><div class="card-title">${esc(e.name)}</div><div class="card-sub">${esc(e.what_do)} · ${esc(e.category)}</div></div>
      <button class="trash" data-action="adminRemoveEmployer" data-id="${e.id}">🗑</button></div>`).join("");
  else if (t === "applicants") {
    if (state.payingApplicant) {
      const pa = state.payingApplicant;
      content = `
        <div class="header" style="border:none;padding:0 0 12px;"><button class="back" data-action="cancelPayApplicant">‹</button><span class="title">Pay ${esc(pa.name)}</span></div>
        <div class="field"><label>AMOUNT ($)</label><input id="pa_amount" value="${esc(pa.amount||"")}" placeholder="100.00"></div>
        <div class="note">Recorded as a payroll expense in your books.</div>
        <button class="btn btn-ink" data-action="sendPayApplicant">Send payment</button>`;
    } else {
      content = state.adminApplications.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">No one has applied to work with FWY directly yet.</div>` :
        state.adminApplications.map(a => `
          <div class="row-item">
            <div style="cursor:pointer;flex:1;" data-action="openApplicantChat" data-id="${a.id}" data-name="${esc(a.name)}">
              <div class="card-title">${esc(a.name)}${a.is_student?" · Student":""}${a.age?` · ${esc(a.age)}y`:""}${unreadBadge(`apply:${a.id}`)}</div><div class="card-sub">${esc(a.profession)} · ${esc(a.location)}</div>
              ${a.money_service ? `<div class="card-sub" style="margin-top:2px;">💳 ${esc(a.money_service)} · ${esc(a.money_number||"")}</div>` : ""}
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <button data-action="startPayApplicant" data-id="${a.id}" data-name="${esc(a.name)}" style="border:none;background:none;cursor:pointer;font-size:15px;">💵</button>
              <button class="trash" data-action="adminRemoveApplication" data-id="${a.id}">🗑</button>
            </div>
          </div>`).join("");
    }
  }
  else if (t === "requests") content = state.adminRequests.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">No service requests yet.</div>` :
    state.adminRequests.map(r => `
      <div class="row-item" style="cursor:pointer;" data-action="openRequestChat" data-id="${r.id}" data-name="${esc(r.company)}">
        <div><div class="card-title">${esc(r.company)}${r.paid?" · ✓ Fee paid":""}${unreadBadge(`service:${r.id}`)}</div><div class="card-sub">${esc(r.who_needed)} × ${esc(r.how_many||"1")} · ${esc(r.status||"pending")}</div></div>
        <button class="trash" data-action="adminRemoveRequest" data-id="${r.id}" onclick="event.stopPropagation()">🗑</button>
      </div>`).join("");
  else if (t === "chat") {
    if (state.adminRole === "owner") {
      content = state.adminHelpers.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">No helper admins to message yet.</div>` :
        state.adminHelpers.map(h => `
          <div class="row-item" style="cursor:pointer;" data-action="openStaffChat" data-id="${h.user_id}" data-name="${esc(h.name||'Helper')}">
            <div><div class="card-title">${esc(h.name||"Unnamed")}</div><div class="card-sub">Tap to message</div></div>
          </div>`).join("");
    } else {
      content = `<div style="font-size:12px;color:var(--inkSoft);">Opening your chat with the owner…</div>`;
    }
  }
  else if (t === "ai") {
    content = `
      <div style="font-size:11.5px;color:var(--inkSoft);margin-bottom:10px;">${state.adminRole === "owner" ? "Private to you — can see the books." : "Private to you — general assistant."}</div>
      <div style="display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:320px;overflow-y:auto;margin-bottom:10px;">
        ${state.aiChatMsgs.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);text-align:center;margin-top:20px;">Ask me anything about running FWY.</div>` :
          state.aiChatMsgs.map(m => `<div style="align-self:${m.role==='user'?'flex-end':'flex-start'};background:${m.role==='user'?'var(--ink)':'#fff'};color:${m.role==='user'?'#fff':'var(--ink)'};border:${m.role==='user'?'none':'1px solid var(--stoneDark)'};border-radius:12px;padding:8px 12px;font-size:12.5px;max-width:78%;">${esc(m.text)}</div>`).join("")}
        ${state.aiChatLoading ? `<div style="align-self:flex-start;border:1px solid var(--stoneDark);border-radius:12px;padding:8px 12px;font-size:12.5px;">…</div>` : ""}
      </div>
      <div style="display:flex;gap:8px;">
        <input id="aiChatInput" placeholder="Ask AI..." style="flex:1;border:1px solid var(--stoneDark);border-radius:10px;padding:9px 11px;font-size:12.5px;">
        <button data-action="sendAIChat" style="background:var(--ink);border:none;border-radius:10px;width:38px;color:#fff;cursor:pointer;">➤</button>
      </div>`;
  }
  else if (t === "activity") content = state.adminActivity.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">Nothing yet.</div>` :
    state.adminActivity.map(a => `<div class="card"><div style="font-size:12.5px;">${esc(a.message)}</div><div class="card-sub" style="margin-top:2px;">${esc(a.actor_name||"")}</div></div>`).join("");
  else if (t === "money") {
    content = `
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Payment notification email</div>
        <div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:10px;">Where you'll be told about payments received or sent.</div>
        <div class="field"><label>YOUR EMAIL</label><input id="owner_notify_email" value="${esc(state.settings.owner_notify_email||"")}" placeholder="you@email.com"></div>
        <button class="btn btn-ink" data-action="saveNotifyEmail">Save</button>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Add Mukuru</div>
        <div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:10px;">For people paying from abroad.</div>
        <div class="field"><label>MUKURU ACCOUNT NUMBER / PHONE</label><input id="mukuru_number" value="${esc(state.mukuruForm.number)}" placeholder="07XXXXXXXX"></div>
        <div class="field"><label>MERCHANT ID (once approved)</label><input id="mukuru_merchant" value="${esc(state.mukuruForm.merchant_id)}" placeholder="Leave blank until approved"></div>
        <button class="btn btn-ink" data-action="addMukuruAccount">+ Add Mukuru</button>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:10px;">Add EcoCash or OneMoney</div>
        <div class="field"><label>SERVICE</label>
          <select id="money_service">
            <option value="">Select a service</option>
            ${MONEY_SERVICES.filter(m => m !== "Mukuru").map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>NUMBER / ACCOUNT</label><input id="money_number" placeholder="07XXXXXXXX or account number"></div>
        <div class="field"><label>MERCHANT ID (once approved)</label><input id="money_merchant" placeholder="Leave blank until approved"></div>
        <button class="btn btn-ink" data-action="addMoneyAccount">+ Add account</button>
      </div>
      ${state.moneyAccounts.length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">No mobile money accounts added yet.</div>` :
        state.moneyAccounts.map(m => `
        <div class="row-item"><div><div class="card-title">${esc(m.service)}${m.merchant_id ? " · Merchant" : " · Not yet approved"}</div><div class="card-sub">${esc(m.number)}${m.merchant_id ? " · ID: " + esc(m.merchant_id) : ""}</div></div>
        <button class="trash" data-action="removeMoneyAccount" data-id="${m.id}">🗑</button></div>`).join("")}`;
  }
  else if (t === "books") {
    const now = new Date();
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const startOfLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - 7);
    const range = state.booksRange;
    const inRange = (d) => {
      const dt = new Date(d);
      if (range === "week") return dt >= startOfWeek;
      if (range === "month") return dt >= startOfMonth;
      if (range === "lastmonth") return dt >= startOfLastMonth && dt < startOfMonth;
      return true;
    };
    const txns = state.adminTransactions.filter(x => inRange(x.created_at));
    const totalIn = txns.filter(x => x.direction === "in").reduce((a, x) => a + Number(x.amount), 0);
    const totalOut = txns.filter(x => x.direction === "out").reduce((a, x) => a + Number(x.amount), 0);
    const net = totalIn - totalOut;
    const byType = {};
    txns.forEach(x => { byType[x.type] = (byType[x.type] || 0) + (x.direction === "in" ? Number(x.amount) : -Number(x.amount)); });
    const rangeBtn = (val, label) => `<button data-action="setBooksRange" data-range="${val}" style="font-size:10.5px;padding:5px 10px;border-radius:8px;border:1px solid ${range===val?'var(--ink)':'var(--stoneDark)'};background:${range===val?'var(--ink)':'none'};color:${range===val?'#fff':'var(--inkSoft)'};cursor:pointer;">${label}</button>`;
    content = `
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
        ${rangeBtn("week","Last 7 days")}${rangeBtn("month","This month")}${rangeBtn("lastmonth","Last month")}${rangeBtn("all","All time")}
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>Total revenue</span><span>$${totalIn.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--inkSoft);"><span>Total payroll/expenses</span><span>-$${totalOut.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px solid var(--stoneDark);padding-top:8px;">
          <span>${net >= 0 ? "Net profit" : "Net loss"}</span><span style="color:${net >= 0 ? 'var(--moss)' : 'var(--red)'};">$${Math.abs(net).toFixed(2)}</span>
        </div>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:8px;">By category</div>
        ${Object.keys(byType).length===0 ? `<div style="font-size:12px;color:var(--inkSoft);">No transactions in this range.</div>` : Object.entries(byType).map(([k,v]) => `
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>${esc(k)}</span><span>${v>=0?'':'-'}$${Math.abs(v).toFixed(2)}</span></div>
        `).join("")}
      </div>
      <button class="btn btn-ink" data-action="askAIAboutBooks">Ask AI about the books</button>
      <div style="margin-top:12px;">
        ${[...txns].reverse().slice(0,20).map(x => `
          <div class="row-item"><div><div class="card-title">${esc(x.description)}</div><div class="card-sub">${esc(x.type)}</div></div><div style="font-size:12.5px;font-weight:600;color:${x.direction==='in'?'var(--moss)':'var(--red)'};">${x.direction==='in'?'+':'-'}$${Number(x.amount).toFixed(2)}</div></div>
        `).join("")}
      </div>`;
  }
  else if (t === "settings") {
    const s = state.settings;
    content = `
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Free trial length</div>
        <div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:12px;">Applies to new job seeker signups from now on.</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
          <button data-action="changeTrial" data-delta="-1" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--stoneDark);background:#fff;cursor:pointer;font-size:16px;">−</button>
          <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:26px;min-width:60px;text-align:center;">${s.trial_days ?? 3}d</div>
          <button data-action="changeTrial" data-delta="1" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--stoneDark);background:#fff;cursor:pointer;font-size:16px;">+</button>
        </div>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:10px;">Subscription pricing</div>
        <div class="field"><label>SEEKER — WEEKLY ($)</label><input id="price_seeker_weekly" value="${s.seeker_weekly}"></div>
        <div class="field"><label>SEEKER — MONTHLY ($)</label><input id="price_seeker_monthly" value="${s.seeker_monthly}"></div>
        <div class="field"><label>EMPLOYER — WEEKLY ($)</label><input id="price_employer_weekly" value="${s.employer_weekly}"></div>
        <div class="field"><label>EMPLOYER — MONTHLY ($)</label><input id="price_employer_monthly" value="${s.employer_monthly}"></div>
        <button class="btn btn-ink" data-action="savePricing">Save pricing</button>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:10px;">Extra paid features</div>
        <div class="field"><label>BOOST PROFILE ($)</label><input id="price_boost" value="${s.boost_price}"></div>
        <div class="field"><label>VERIFICATION BADGE ($)</label><input id="price_verify" value="${s.verification_price}"></div>
        <div class="field"><label>INTERVIEW CREDIT ($)</label><input id="price_interview" value="${s.interview_credit_price}"></div>
        <div class="field"><label>SERVICE REQUEST FEE ($)</label><input id="price_service_fee" value="${s.service_request_fee}"></div>
        <button class="btn btn-ink" data-action="savePricing">Save pricing</button>
      </div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Payment cut (employer → employee)</div>
        <div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:10px;">Your % on payments made through the app.</div>
        <div class="field"><label>CUT (%)</label><input id="price_cut" value="${s.platform_cut_percent}"></div>
        <button class="btn btn-ink" data-action="savePricing">Save pricing</button>
      </div>`;
  }
  else if (t === "team") {
    if (state.payingHelper) {
      const ph = state.payingHelper;
      content = `
        <div class="header" style="border:none;padding:0 0 12px;"><button class="back" data-action="cancelPayHelper">‹</button><span class="title">Pay ${esc(ph.name)}</span></div>
        <div class="field"><label>AMOUNT ($)</label><input id="ph_pay_amount" value="${esc(ph.amount||"")}" placeholder="100.00"></div>
        <div class="note">Recorded as a payroll expense in your books.</div>
        <button class="btn btn-ink" data-action="sendPayHelper">Send payment</button>`;
    } else {
      const hf = state.helperForm || { name: "", email: "", password: "" };
      content = `
        <div class="card">
          <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">Create a helper login</div>
          <div style="font-size:10.5px;color:var(--inkSoft);margin-bottom:10px;">You set their email and password directly — tell them what it is yourself.</div>
          <div class="field"><label>NAME</label><input id="hf_name" value="${esc(hf.name)}" placeholder="Tendai"></div>
          <div class="field"><label>EMAIL</label><input id="hf_email" value="${esc(hf.email)}" placeholder="tendai@email.com"></div>
          <div class="field"><label>PASSWORD</label><input id="hf_password" value="${esc(hf.password)}" placeholder="At least 6 characters"></div>
          ${state.helperError ? `<div class="err">${esc(state.helperError)}</div>` : ""}
          <button class="btn btn-ink" data-action="createHelper">${state.helperLoading ? "…" : "Create helper login"}</button>
          <div style="font-size:9.5px;color:var(--inkSoft);margin-top:8px;line-height:1.5;">They'll need to confirm the email before they can log in — check that inbox first.</div>
        </div>
        ${state.adminHelpers && state.adminHelpers.length > 0 ? state.adminHelpers.map(h => `
          <div class="row-item"><div><div class="card-title">${esc(h.name||"Unnamed")}</div><div class="card-sub">Helper admin</div></div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button data-action="startPayHelper" data-id="${h.user_id}" data-name="${esc(h.name||'Helper')}" style="border:none;background:none;cursor:pointer;font-size:15px;">💵</button>

          </div></div>`).join("")
          : `<div style="font-size:12px;color:var(--inkSoft);">No helper admins yet.</div>`}`;
    }
  }

  return `
  <div class="statusbar"><span>9:41</span><span>FWY</span></div>
  <div class="header"><span class="title">Admin · ${esc(state.adminRole||"")}</span></div>
  <div class="body">
    ${state.adminRole === "owner" ? `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12.5px;font-weight:600;">AI-powered matching</div>
        <div style="font-size:10.5px;color:var(--inkSoft);margin-top:2px;">Uses real AI to rank matches instead of simple category filtering.</div>

async function doAuth(mode, role) {
  const f = state.authForm;
  if (!f.email || !f.password) { state.authError = "Enter email and password."; render(); return; }
  state.authLoading = true; state.authError = ""; render();
  try {
    const fn = mode === "signUp" ? sb.auth.signUp.bind(sb.auth) : sb.auth.signInWithPassword.bind(sb.auth);
    const { data, error } = await fn({ email: f.email, password: f.password });
    state.authLoading = false;
    if (error) {
      if (/email not confirmed/i.test(error.message || "")) {
        state.authOtpPending = { email: f.email, role }; state.authOtpCode = ""; state.authOtpError = "";
        render(); return;
      }
      state.authError = error.message; render(); return;
    }
    if (role === "admin") {
      if (!data.session) { state.authOtpPending = { email: f.email, role }; state.authOtpCode = ""; state.authOtpError = ""; render(); return; }
      const { data: roleRow, error: roleSelErr } = await sb.from("roles").select("*").eq("user_id", data.user.id).maybeSingle();
      if (roleSelErr) { state.authError = "Couldn't check your admin role: " + roleSelErr.message; await sb.auth.signOut(); render(); return; }
      if (!roleRow) { state.authError = "This account has no admin role assigned."; await sb.auth.signOut(); render(); return; }
      state.adminSession = data.session; state.adminRole = (roleRow.role || "").trim().toLowerCase();
      await loadAdminLists();
    } else {
      if (!data.session) { state.authOtpPending = { email: f.email, role }; state.authOtpCode = ""; state.authOtpError = ""; render(); return; }
      state.session = data.session;
      await loadMyProfiles();
    }
    render();
  } catch (err) {
    state.authLoading = false;
    state.authError = "Connection problem: " + (err && err.message ? err.message : "something went wrong. Try again.");
    render();
  }
}
async function verifyAuthOtp() {
  const pending = state.authOtpPending;
  if (!pending) return;
  const code = (state.authOtpCode || "").trim();
  if (!code) { state.authOtpError = "Enter the code from your email."; render(); return; }
  state.authOtpLoading = true; state.authOtpError = ""; render();
  const { data, error } = await sb.auth.verifyOtp({ email: pending.email, token: code, type: "signup" });
  state.authOtpLoading = false;
  if (error) { state.authOtpError = error.message; render(); return; }
  if (pending.role === "admin") {
    const { data: roleRow, error: roleSelErr } = await sb.from("roles").select("*").eq("user_id", data.user.id).maybeSingle();
    if (roleSelErr) { state.authOtpError = "Couldn't check your admin role: " + roleSelErr.message; render(); return; }
    if (!roleRow) { state.authOtpError = "This account has no admin role assigned."; await sb.auth.signOut(); render(); return; }
    state.adminSession = data.session; state.adminRole = (roleRow.role || "").trim().toLowerCase();
    await loadAdminLists();
  } else {
    state.session = data.session;
    await loadMyProfiles();
  }
  state.authOtpPending = null; state.authOtpCode = ""; state.authOtpError = "";
  render();
}
async function resendAuthOtp() {
  const pending = state.authOtpPending;
  if (!pending) return;
  state.authOtpLoading = true; render();
  const { error } = await sb.auth.resend({ type: "signup", email: pending.email });
  state.authOtpLoading = false;
  state.authOtpError = error ? error.message : "New code sent — check your email.";
  render();
}
function cancelAuthOtp() {
  state.authOtpPending = null; state.authOtpCode = ""; state.authOtpError = "";
  render();
}

async function callClaude(systemPrompt, userText) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      system: systemPrompt,
      messages: [{ role: "user", content: userText }],
    }),
  });
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || "").join("\n").trim();
  return text;
}

async function runAIMatch(role) {
  const mine = state.myProfile;
  const pool = role === "seeker" ? state.employers : state.seekers;
  if (!mine || pool.length === 0) { state.aiMatches = []; return; }
  state.aiMatchLoading = true; state.aiMatchError = ""; render();
  try {
    const poolText = pool.map(p => role === "seeker"
      ? `id:${p.id} | ${p.name} | needs: ${p.what_do} | category: ${p.category}`
      : `id:${p.id} | ${p.name} | profession: ${p.profession} | qualifications: ${p.qualifications || "none"} | category: ${p.category}`
    ).join("\n");
    const myText = role === "seeker"
      ? `Profession: ${mine.profession}. Qualifications: ${mine.qualifications || "none"}. Department: ${mine.department}.`
      : `Looking for: ${mine.what_do}. Department needed: ${mine.category}.`;
    const sys = "You are a matching assistant for a Zimbabwean job marketplace called FWY. Given one person's profile and a list of candidates, return ONLY a JSON array of objects like [{\"id\":\"<id>\",\"reason\":\"<one short sentence>\"}], best match first. No other text, no markdown fences.";
    const userText = `My profile:\n${myText}\n\nCandidates:\n${poolText}\n\nReturn the best matches as JSON.`;
    const raw = await callClaude(sys, userText);
    const cleaned = raw.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    state.aiMatches = parsed.map(m => ({
      ...pool.find(p => p.id === m.id),
      aiReason: m.reason,
    })).filter(p => p.id);
  } catch (err) {
    state.aiMatchError = "AI matching hit a snag — showing regular matches instead.";
    state.aiMatches = null;
  }
  state.aiMatchLoading = false;
  render();
}

async function loadAdminLists() {
  const { data: s } = await sb.from("seekers").select("*");
  const { data: e } = await sb.from("employers").select("*");
  const { data: apps } = await sb.from("team_applications").select("*").order("created_at", { ascending: false });
  const { data: reqs } = await sb.from("service_requests").select("*").order("created_at", { ascending: false });
  const { data: activity } = await sb.from("admin_activity").select("*").order("created_at", { ascending: false }).limit(30);
  state.adminSeekers = s || []; state.adminEmployers = e || [];
  state.adminApplications = apps || []; state.adminRequests = reqs || [];
  state.adminActivity = activity || [];
  const pendingSeekers = state.adminSeekers.filter(x => x.verification_pending && !x.verified);
  for (const seeker of pendingSeekers) {
    try {
      const { data: v } = await sb.from("verifications").select("*").eq("user_id", seeker.user_id).maybeSingle();
      if (v && v.status === "pending") {
        const { data: idUrlData } = await sb.storage.from("verification-docs").createSignedUrl(v.id_document_path, 3600);
        const { data: clearanceUrlData } = await sb.storage.from("verification-docs").createSignedUrl(v.police_clearance_path, 3600);
        seeker._verification = { ...v, _idUrl: idUrlData?.signedUrl, _clearanceUrl: clearanceUrlData?.signedUrl };
      } else if (v) {
        seeker._verification = v;
      }
    } catch { /* skip — doc view just won't show */ }
  }
  if (state.adminRole === "owner") {
    const { data: helpers } = await sb.from("roles").select("*").eq("role", "helper");
    const { data: money } = await sb.from("money_accounts").select("*");
    const { data: txns } = await sb.from("transactions").select("*").order("created_at", { ascending: false });
    state.adminHelpers = helpers || [];
    state.moneyAccounts = money || [];
    state.adminTransactions = txns || [];
  }
  await loadUnreadCounts();
}
async function createHelper() {
  const f = state.helperForm;
  if (!f.name || !f.email || !f.password) { state.helperError = "Fill in all fields."; render(); return; }
  if (f.password.length < 6) { state.helperError = "Password needs at least 6 characters."; render(); return; }
  state.helperLoading = true; state.helperError = ""; render();
  const adminSession = state.adminSession; // signUp below swaps the client's active session to the new helper — save admin's first
  try {
    const { data, error } = await sb.auth.signUp({ email: f.email, password: f.password });
    if (error) { state.helperError = error.message; state.helperLoading = false; render(); return; }
    if (adminSession) {
      const { data: restored, error: restoreErr } = await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
      if (restoreErr) { state.helperError = "Helper account created, but couldn't restore your admin session: " + restoreErr.message + " — please log back in as admin and add their role from Team manually if needed."; state.helperLoading = false; render(); return; }
      state.adminSession = restored.session;
    }
    const { error: roleErr } = await sb.from("roles").insert({ user_id: data.user.id, role: "helper", name: f.name, email: f.email });
    if (roleErr) { state.helperError = "Account created, but couldn't assign helper role: " + roleErr.message; state.helperLoading = false; render(); return; }
    state.adminHelpers = [...state.adminHelpers, { user_id: data.user.id, role: "helper", name: f.name, email: f.email }];
    state.helperForm = { name: "", email: "", password: "" };
  } catch (err) {
    state.helperError = "Something went wrong: " + (err && err.message ? err.message : "try again.");
  }
  state.helperLoading = false;
  render();
}

// ---- WebRTC calling (peer-to-peer, signaled via Supabase Realtime — no third-party call server) ----
let rtcPeer = null, rtcChannel = null, rtcLocalStream = null, rtcMyId = null, rtcRoom = null, rtcAudioOnly = false, rtcPolite = false, rtcMakingOffer = false;
const RTC_ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
];
function startCall(audioOnly, room) {
  if (!room) return;
  rtcAudioOnly = audioOnly;
  rtcRoom = "fwy-call-" + room;
  rtcMyId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now());
  document.getElementById("callOverlay").classList.add("open");
  document.getElementById("callStatus").textContent = "Connecting…";
  document.getElementById("remoteAvatar").style.display = audioOnly ? "flex" : "none";
  document.getElementById("localVideo").style.display = audioOnly ? "none" : "block";
  const myInitial = ((state.myProfile && state.myProfile.name) || (state.adminSession ? "A" : "G")).trim().charAt(0).toUpperCase() || "?";
  document.getElementById("remoteAvatar").textContent = myInitial;
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: audioOnly ? false : { width: { ideal: 480 }, height: { ideal: 640 } } })
    .then((stream) => {
      rtcLocalStream = stream;
      if (!audioOnly) document.getElementById("localVideo").srcObject = stream;
      setupRtcPeer();
      joinRtcChannel();
    })
    .catch((err) => {
      alert("Couldn't access microphone/camera: " + err.message);
      endCall();
    });
}
function setupRtcPeer() {
  rtcPeer = new RTCPeerConnection({ iceServers: RTC_ICE_SERVERS });
  rtcLocalStream.getTracks().forEach(t => rtcPeer.addTrack(t, rtcLocalStream));
  rtcPeer.ontrack = (e) => {
    document.getElementById("callStatus").textContent = "Connected";
    if (!rtcAudioOnly) {
      const rv = document.getElementById("remoteVideo");
      if (rv.srcObject !== e.streams[0]) rv.srcObject = e.streams[0];
    } else {
      let a = document.getElementById("remoteAudioEl");
      if (!a) { a = document.createElement("audio"); a.id = "remoteAudioEl"; a.autoplay = true; document.body.appendChild(a); }
      if (a.srcObject !== e.streams[0]) a.srcObject = e.streams[0];
    }
  };
  rtcPeer.onicecandidate = (e) => {
    if (e.candidate && rtcChannel) rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "ice", data: e.candidate } });
  };
  rtcPeer.onconnectionstatechange = () => {
    if (rtcPeer && (rtcPeer.connectionState === "failed" || rtcPeer.connectionState === "disconnected")) {
      document.getElementById("callStatus").textContent = "Connection lost";
    }
  };
}
async function initiateOffer() {
  if (!rtcPeer || rtcMakingOffer || rtcPeer.signalingState !== "stable") return;
  try {
    rtcMakingOffer = true;
    const offer = await rtcPeer.createOffer();
    await rtcPeer.setLocalDescription(offer);
    rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "sdp", data: rtcPeer.localDescription } });
  } catch (err) { console.error(err); } finally { rtcMakingOffer = false; }
}
function joinRtcChannel() {
  rtcChannel = sb.channel(rtcRoom, { config: { broadcast: { self: false } } });
  rtcChannel.on("broadcast", { event: "signal" }, async ({ payload }) => {
    if (!payload || payload.from === rtcMyId || !rtcPeer) return;
    if (rtcPolite === false && payload.from) rtcPolite = rtcMyId > payload.from; // deterministic: higher id is polite
    if (payload.kind === "sdp") {
      const desc = payload.data;
      const offerCollision = desc.type === "offer" && (rtcMakingOffer || rtcPeer.signalingState !== "stable");
      const ignoreOffer = !rtcPolite && offerCollision;
      if (ignoreOffer) return;
      await rtcPeer.setRemoteDescription(desc);
      if (desc.type === "offer") {
        const answer = await rtcPeer.createAnswer();
        await rtcPeer.setLocalDescription(answer);
        rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "sdp", data: rtcPeer.localDescription } });
      }
    } else if (payload.kind === "ice") {
      try { await rtcPeer.addIceCandidate(payload.data); } catch (err) { /* ignore benign races */ }
    } else if (payload.kind === "bye") {
      endCall();
    }
  }).subscribe((status) => {
    if (status === "SUBSCRIBED") {
      // Both sides attempt to offer; polite/impolite comparison above resolves any glare.
      initiateOffer();
    }
  });
}
function toggleMuteCall() {
  if (!rtcLocalStream) return;
  const track = rtcLocalStream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  document.getElementById("muteBtn").classList.toggle("off", !track.enabled);
}
function toggleCamCall() {
  if (!rtcLocalStream) return;
  const track = rtcLocalStream.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  document.getElementById("camBtn").classList.toggle("off", !track.enabled);
}
function endCall() {
  if (rtcChannel) { try { rtcChannel.send({ type: "broadcast", event: "signal", payload: { from: rtcMyId, kind: "bye" } }); } catch (e) {} sb.removeChannel(rtcChannel); rtcChannel = null; }
  if (rtcPeer) { rtcPeer.close(); rtcPeer = null; }
  if (rtcLocalStream) { rtcLocalStream.getTracks().forEach(t => t.stop()); rtcLocalStream = null; }
  rtcPolite = false; rtcMakingOffer = false;
  const remoteAudioEl = document.getElementById("remoteAudioEl");
  if (remoteAudioEl) remoteAudioEl.remove();
  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("localVideo").srcObject = null;
  document.getElementById("muteBtn").classList.remove("off");
  document.getElementById("camBtn").classList.remove("off");
  document.getElementById("callOverlay").classList.remove("open");
}

  if (!error) { state.serviceChatMsgs = [...state.serviceChatMsgs, row]; render(); }
}

// ---- Chat attachments: voice notes, photos, documents (shared across all 4 chats) ----
function chatContextInfo(ctx) {
  if (ctx === "direct") {
    if (!state.directChat) return null;
    return { chatKey: state.directChat.chatKey, senderId: state.session.user.id, senderRole: state.directChat.myRole };
  }
  if (ctx === "team") {
    if (!state.myApplication) return null;
    return { chatKey: `apply:${state.myApplication.id}`, senderId: state.session.user.id, senderRole: "applicant" };
  }
  if (ctx === "service") {
    if (!state.myServiceRequest) return null;
    return { chatKey: `service:${state.myServiceRequest.id}`, senderId: state.session.user.id, senderRole: "company" };
  }
  if (ctx === "admin") {
    if (!state.adminOpenChat) return null;
    return { chatKey: state.adminOpenChat.chatKey, senderId: state.adminSession.user.id, senderRole: "admin" };
  }
  return null;
}
async function refreshChatMsgs(ctx) {
  const info = chatContextInfo(ctx);
  if (!info) return;
  const { data } = await sb.from("chat_messages").select("*").eq("chat_key", info.chatKey).order("created_at", { ascending: true });
  let rows = data || [];
  if (ctx === "direct") {
    const hideCol = state.directChat.myRole === "seeker" ? "hidden_for_seeker" : "hidden_for_employer";
    state.directChat.msgs = rows.filter(m => !m[hideCol]);
  } else if (ctx === "team") state.teamChatMsgs = rows.filter(m => !m.hidden_for_user);
  else if (ctx === "service") state.serviceChatMsgs = rows.filter(m => !m.hidden_for_user);
  else if (ctx === "admin") state.adminChatMsgs = rows.filter(m => !m.hidden_for_admin);
  const inputId = ctx === "direct" ? "directChatInput" : ctx === "team" ? "teamChatInput" : ctx === "service" ? "serviceChatInput" : "adminChatInput";
  const active = document.activeElement;
  if (active && active.id === inputId) return; // don't steal focus / dismiss the keyboard while typing
  renderKeepScroll();
}
async function uploadChatAttachment(file, kind) {
  const safeName = (file.name || `${kind}-${Date.now()}`).replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${kind}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safeName}`;
  const { error } = await sb.storage.from("chat-attachments").upload(path, file, { upsert: false });
  if (error) { alert("Upload failed: " + error.message); return null; }
  return path;
}
async function sendChatAttachment(ctx, file, kind) {
  const info = chatContextInfo(ctx);
  if (!info || !file) return;
  const path = await uploadChatAttachment(file, kind);
  if (!path) return;
  const label = kind === "audio" ? "🎤 Voice note" : kind === "image" ? "📷 Photo" : ("📄 " + (file.name || "Document"));
  const row = { chat_key: info.chatKey, sender_id: info.senderId, sender_role: info.senderRole, text: label, attachment_path: path, attachment_type: kind, attachment_name: file.name || null };
  const { error } = await sb.from("chat_messages").insert(row);
  if (error) { alert("Couldn't send: " + error.message); return; }
  await refreshChatMsgs(ctx);
}
function pickChatFile(ctx, kind) {
  if (!chatContextInfo(ctx)) return;
  const input = document.createElement("input");
  input.type = "file";
  if (kind === "image") input.accept = "image/*";
  else input.accept = ".pdf,.doc,.docx,.xls,.xlsx,.txt,.ppt,.pptx,image/*";
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const realKind = (kind === "document" && file.type && file.type.startsWith("image/")) ? "image" : kind;
    await sendChatAttachment(ctx, file, realKind);
  };
  input.click();
}
let voiceRecorder = null, voiceChunks = [], voiceRecordingCtx = null;
async function toggleVoiceNote(ctx) {
  if (!chatContextInfo(ctx)) return;
  if (voiceRecordingCtx === ctx) { voiceRecorder.stop(); return; }
  if (voiceRecordingCtx) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceChunks = [];
    voiceRecorder = new MediaRecorder(stream);
    voiceRecordingCtx = ctx;
    const btn = document.getElementById("voiceBtn_" + ctx);
    if (btn) { btn.textContent = "⏹"; btn.style.color = "var(--red)"; }
    voiceRecorder.ondataavailable = (e) => { if (e.data.size > 0) voiceChunks.push(e.data); };
    voiceRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const doneBtn = document.getElementById("voiceBtn_" + ctx);
      if (doneBtn) { doneBtn.textContent = "🎤"; doneBtn.style.color = ""; }
      voiceRecordingCtx = null;
      const blob = new Blob(voiceChunks, { type: "audio/webm" });
      if (blob.size > 500) {
        const file = new File([blob], `voice-${Date.now()}.webm`, { type: "audio/webm" });
        await sendChatAttachment(ctx, file, "audio");
      }
    };
    voiceRecorder.start();
  } catch (err) {
    voiceRecordingCtx = null;
    alert("Couldn't access microphone: " + err.message);
  }
}

async function logTransaction(type, description, amount, direction) {
  await sb.from("transactions").insert({ type, description, amount, direction });
}
async function sendEmailNotification(to, subject, message) {
  if (!to) return;
  try {
    await fetch(EMAIL_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ to, subject, message }),
    });
  } catch { /* email is best-effort, never block the transaction */ }
}
async function logActivity(message) {
  const name = state.adminRole === "owner" ? "Owner" : (state.adminHelpers.find(h => h.user_id === state.adminSession.user.id)?.name || "Admin");

}

async function confirmSeekerPayment() {
  const b = state.selectedBundle;
  const s = state.settings;
  const mine = state.myProfile;
  if (!mine) return;
  const updates = {};
  let type = "", desc = "", price = 0;
  if (b === "seekerWeekly") { updates.paid = true; type = "Subscription"; desc = "Seeker weekly access — " + mine.name; price = s.seeker_weekly; }
  else if (b === "seekerMonthly") { updates.paid = true; type = "Subscription"; desc = "Seeker monthly access — " + mine.name; price = s.seeker_monthly; }
  else if (b === "boost") { updates.boosted = true; type = "Boost"; desc = "Boost Profile — " + mine.name; price = s.boost_price; }
  else if (b === "verify") { updates.verification_pending = true; type = "Verification"; desc = "Verification Badge — " + mine.name; price = s.verification_price; }
  else if (b === "interview") { updates.interview_credits = (mine.interview_credits || 0) + 1; type = "Interview Credit"; desc = "Interview Credit — " + mine.name; price = s.interview_credit_price; }
  const { data, error } = await sb.from("seekers").update(updates).eq("id", mine.id).select().maybeSingle();
  if (!error && data) state.myProfile = data;
  await logTransaction(type, desc, price, "in");
  const payerEmail = state.session?.user?.email;
  sendEmailNotification(payerEmail, "FWY payment received", `We've received your payment for ${desc.split(" — ")[0] || type}: $${price.toFixed(2)}.`);
  sendEmailNotification(state.settings.owner_notify_email, "FWY: payment received", `${desc} — $${price.toFixed(2)} received.`);
  state.seekerStep = "matches";
  state.selectedPaymentMethod = null;
  render();
}
async function confirmEmployerPayment() {
  const b = state.selectedBundle;
  const s = state.settings;
  const mine = state.myProfile;
  if (!mine) return;
  const price = b === "employerWeekly" ? s.employer_weekly : s.employer_monthly;
  const { data, error } = await sb.from("employers").update({ paid: true }).eq("id", mine.id).select().maybeSingle();
  if (!error && data) state.myProfile = data;
  await logTransaction("Subscription", "Employer access — " + mine.name, price, "in");

  sendEmailNotification(state.settings.owner_notify_email, "FWY: payment received", `Employer access — ${mine.name} — $${price.toFixed(2)} received.`);
  state.employerStep = "candidates";
  state.selectedPaymentMethod = null;
  render();
}
async function confirmServiceFeePayment() {
  const req = state.myServiceRequest;
  if (!req) return;
  const { data, error } = await sb.from("service_requests").update({ paid: true }).eq("id", req.id).select().maybeSingle();

}

async function loadAIChat() {

function booksSummary() {
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - 7);
  const range = state.booksRange;
  const inRange = (d) => {
    const dt = new Date(d);
    if (range === "week") return dt >= startOfWeek;
    if (range === "month") return dt >= startOfMonth;
    if (range === "lastmonth") return dt >= startOfLastMonth && dt < startOfMonth;
    return true;
  };
  const txns = state.adminTransactions.filter(x => inRange(x.created_at));
  const totalIn = txns.filter(x => x.direction === "in").reduce((a, x) => a + Number(x.amount), 0);
  const totalOut = txns.filter(x => x.direction === "out").reduce((a, x) => a + Number(x.amount), 0);
  const byType = {};
  txns.forEach(x => { byType[x.type] = (byType[x.type] || 0) + (x.direction === "in" ? Number(x.amount) : -Number(x.amount)); });
  const lines = Object.entries(byType).map(([k, v]) => `${k}: $${v.toFixed(2)}`).join(", ");
  const rangeLabel = { week: "the last 7 days", month: "this month", lastmonth: "last month", all: "all time" }[range] || "all time";
  return `Range: ${rangeLabel}. Total revenue: $${totalIn.toFixed(2)}. Total payroll/expenses: $${totalOut.toFixed(2)}. Net: $${(totalIn - totalOut).toFixed(2)}. Breakdown — ${lines || "no transactions yet"}.`;
}
async function sendAIChat() {
  const input = document.getElementById("aiChatInput");
  const text = input && input.value.trim();
  if (!text || state.aiChatLoading) return;
  const uid = state.adminSession.user.id;
  const isOwner = state.adminRole === "owner";
  await sb.from("ai_messages").insert({ user_id: uid, role: "user", text });
  state.aiChatMsgs = [...state.aiChatMsgs, { role: "user", text }];
  state.aiChatLoading = true; render();
  const context = isOwner ? `[Context: you're helping the owner of FWY, a Zimbabwean job marketplace app. Current books: ${booksSummary()}]\n\n` : `[Context: you're helping a staff admin at FWY, a Zimbabwean job marketplace app, with day-to-day tasks.]\n\n`;
  try {
    const reply = await callClaude("You are a helpful assistant for FWY staff.", context + text);
    await sb.from("ai_messages").insert({ user_id: uid, role: "assistant", text: reply });
    state.aiChatMsgs = [...state.aiChatMsgs, { role: "assistant", text: reply }];
  } catch {
    state.aiChatMsgs = [...state.aiChatMsgs, { role: "assistant", text: "Something went wrong reaching AI — try again." }];
  }
  state.aiChatLoading = false;
  render();
}

    state.aiChatMsgs = [...state.aiChatMsgs, { role: "assistant", text: "Something went wrong reaching AI — try again." }];
  }

  render();
}
